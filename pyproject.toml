[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crawlcraft"
version = "0.1.0"
description = "High-throughput async web crawler and semantic markdown extractor for LLMs and RAG pipelines."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Alexandr Motologa", email = "alexandrmotologa@gmail.com" }
]
keywords = [
    "web-scraping",
    "rag",
    "content-extraction",
    "http2",
    "markdown",
    "json-ld",
    "opengraph",
    "asyncio",
    "token-bucket",
    "crawler",
    "fastapi",
    "selectolax",
    "playwright"
]
dependencies = [
    "httpx[http2]>=0.28.1",
    "selectolax>=1.0.1",
    "tiktoken>=0.14.0",
    "playwright>=1.40.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "python-multipart>=0.0.9",
    "brotli>=1.1.0",
    "zstandard>=0.23.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[project.scripts]
crawlcraft = "crawlcraft.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["crawlcraft*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
