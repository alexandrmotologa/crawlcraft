<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#091e16"/>
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="4"/>

  <!-- Subtle network grid lines -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#10b981" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="256" cy="256" r="80" fill="none" stroke="#10b981" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Radial grid spokes -->
  <line x1="116" y1="256" x2="396" y2="256" stroke="#10b981" stroke-opacity="0.15" stroke-width="2"/>
  <line x1="256" y1="116" x2="256" y2="396" stroke="#10b981" stroke-opacity="0.15" stroke-width="2"/>
  <line x1="157" y1="157" x2="355" y2="355" stroke="#10b981" stroke-opacity="0.12" stroke-width="2"/>
  <line x1="157" y1="355" x2="355" y2="157" stroke="#10b981" stroke-opacity="0.12" stroke-width="2"/>

  <!-- Crawler Spider Legs (Angular & High-Tech) -->
  <g stroke="url(#primary-grad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top Left -->
    <path d="M 216 216 L 150 160 L 110 180" />
    <!-- Mid Left -->
    <path d="M 200 256 L 130 256 L 90 280" />
    <!-- Bot Left -->
    <path d="M 216 296 L 150 352 L 120 400" />

    <!-- Top Right -->
    <path d="M 296 216 L 362 160 L 402 180" />
    <!-- Mid Right -->
    <path d="M 312 256 L 382 256 L 422 280" />
    <!-- Bot Right -->
    <path d="M 296 296 L 362 352 L 392 400" />
  </g>

  <!-- Central Hex Core Body -->
  <polygon points="256,170 310,205 310,305 256,340 202,305 202,205" fill="#064e3b" stroke="url(#accent-grad)" stroke-width="6" filter="url(#glow)"/>

  <!-- Inner High-Speed Lightning Arrow / Data Shard -->
  <path d="M 264 195 L 230 252 L 260 252 L 244 315 L 284 246 L 254 246 Z" fill="url(#primary-grad)"/>

  <!-- Connection Nodes -->
  <circle cx="110" cy="180" r="6" fill="#34d399"/>
  <circle cx="90" cy="280" r="6" fill="#34d399"/>
  <circle cx="120" cy="400" r="6" fill="#34d399"/>
  <circle cx="402" cy="180" r="6" fill="#34d399"/>
  <circle cx="422" cy="280" r="6" fill="#34d399"/>
  <circle cx="392" cy="400" r="6" fill="#34d399"/>
</svg>
